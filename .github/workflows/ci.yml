name: CI StreamChat NLP

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '*.md'
      - '.gitignore'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # SCAN DE SECRETS
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances avec uv
        run: uv sync --frozen

      - name: Vérifier la syntaxe et le formattage
        run: |
          uv run python -m py_compile streamlit_app.py

      - name: Test d'inférence API Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run python -c "
          import os
          import numpy as np
          from huggingface_hub import InferenceClient

          token = os.getenv('HF_TOKEN')
          assert token, 'HF_TOKEN manquant dans les secrets GitHub'

          client = InferenceClient(token=token)
          res = client.feature_extraction(
              text=['Bonjour', 'Hello'],
              model='sentence-transformers/all-MiniLM-L6-v2'
          )
          arr = np.array(res)
          if arr.ndim == 3:
              arr = np.mean(arr, axis=1)

          # Similarité cosinus avec NumPy
          dot = np.dot(arr[0], arr[1])
          norm = np.linalg.norm(arr[0]) * np.linalg.norm(arr[1])
          score = dot / norm

          assert score > 0.5, f'Test d\'inférence échoué avec un score de {score}'
          print(f'✅ Test MLOps API validé avec succès (Score: {score:.3f})')
          "

      # SCAN DOS & SÉCURITÉ CODE (Bandit)
      - name: Scan des faiblesses de code (Bandit)
        run: uvx bandit -r . -x ./.venv -ll

      # SCAN DE VULNÉRABILITÉS (Trivy)
      - name: Scan des vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'