[project]
name = "stream-chat-nlp"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.3.2",
    "fasttext-wheel>=0.9.2",
    "huggingface-hub>=0.36.2",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "streamlit>=1.40.1"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
